<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />

  <body>
    <div id="app">
      <canvas id="view" aria-label="Blackout Floor game view"></canvas>
      <div id="vignette"></div>
      <div id="hurt"></div>
      <header id="hud" hidden>
        <div class="hp" aria-hidden="true"><span id="hp-fill"></span></div>
        <div id="wave">1 / 5</div>
        <div id="ammo">15  60</div>
      </header>
      <div id="banner"></div>
      <div id="pings"></div>
      <div class="zone left" id="zone-l">
        <div class="base"><div class="nub" id="nub-l"></div></div>
      </div>
      <div class="zone right" id="zone-r">
        <div class="base"><div class="nub" id="nub-r"></div></div>
      </div>
      <button id="reload" type="button" hidden>Reload</button>
      <div id="overlay">
        <div class="card">
          <p class="kicker" id="kicker">Night operations</p>
          <h1 id="title">Blackout Floor</h1>
          <p id="blurb">The fluorescents died on fourteen. Five waves, then the stairwell.</p>
          <p class="hint" id="hint">Left thumb moves. Right thumb aims and fires.</p>
          <button id="action" type="button">Begin shift</button>
        </div>
      </div>
      <div id="boot">Raising the floor…</div>
    </div>
  </body>
